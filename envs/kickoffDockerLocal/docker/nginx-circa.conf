server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location ^~ /nodics/profile/ { proxy_pass http://platform:4300; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/commsApi/ { proxy_pass http://engagement:4340; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/locationMap/ { proxy_pass http://location:4380; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/cms/ { proxy_pass http://wcms-online:4314; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/media/v0/content/ { proxy_pass http://wcms-online:4314; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/media/ { proxy_pass http://wcms-staged:4312; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location ^~ /nodics/ { proxy_pass http://waste:4370; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 180s; client_max_body_size 12m; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 1h; add_header Cache-Control "public, immutable"; }
}
