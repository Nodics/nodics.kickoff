name: Kickoff Verification

on:
  push:
    branches:
      - development
      - master
      - 'codex/release-native-local/**'
  workflow_dispatch:
  pull_request:
    branches:
      - development
      - master

jobs:
  verify:
    name: Verify reference runtime on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      NATIVE_LOCAL_RELEASE: ${{ startsWith(github.ref, 'refs/heads/codex/release-native-local/') }}
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - name: Checkout Kickoff
        uses: actions/checkout@v4
        with:
          path: nodics.kickoff
      - name: Select exact Framework revision
        id: framework
        shell: bash
        env:
          NODICS_FRAMEWORK_SHA: ${{ vars.NODICS_FRAMEWORK_SHA }}
        run: |
          if [[ "$NATIVE_LOCAL_RELEASE" == "true" ]]; then
            NODICS_FRAMEWORK_SHA=$(<nodics.kickoff/.github/native-local-framework.sha)
          fi
          if [[ ! "$NODICS_FRAMEWORK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Set NODICS_FRAMEWORK_SHA to the compatible published framework commit before verification."
            exit 1
          fi
          echo "sha=$NODICS_FRAMEWORK_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout selected Nodics framework commit
        uses: actions/checkout@v4
        with:
          repository: Nodics/nodics.ai
          ref: ${{ steps.framework.outputs.sha }}
          path: nodics.ai
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: nodics.kickoff/package-lock.json
      - name: Install framework dependencies
        working-directory: nodics.ai
        run: npm ci
      - name: Qualify Framework for this downstream release
        if: env.NATIVE_LOCAL_RELEASE == 'true'
        working-directory: nodics.ai
        run: npm run release:check -- --execute --project-qualification
      - name: Install project dependencies
        working-directory: nodics.kickoff
        run: npm ci
      - name: Run Native Local project verification
        if: env.NATIVE_LOCAL_RELEASE == 'true'
        working-directory: nodics.kickoff
        run: npm run test:native-local
      - name: Run full project verification
        if: env.NATIVE_LOCAL_RELEASE != 'true'
        working-directory: nodics.kickoff
        run: npm test
